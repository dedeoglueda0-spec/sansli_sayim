<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="theme-color" content="#10182f">

    <link rel="manifest" href="manifest.json">

    <title>Şanslı Sayım</title>

    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            font-family: Arial, sans-serif;
            overflow: hidden;

            background:
                radial-gradient(
                    circle at 15% 15%,
                    #263b73 0%,
                    transparent 35%
                ),

                radial-gradient(
                    circle at 85% 85%,
                    #482a70 0%,
                    transparent 40%
                ),

                linear-gradient(
                    135deg,
                    #10182f,
                    #1d1740
                );
        }

        /* ANA UYGULAMA */

        .app {

            width: 100%;
            height: 100dvh;
            min-height: 100vh;

            display: flex;
            flex-direction: column;

            padding:
                max(25px, env(safe-area-inset-top))
                25px
                max(25px, env(safe-area-inset-bottom))
                25px;

            position: relative;

            overflow: hidden;
        }

        /* ÜST KISIM */

        .header {

            width: 100%;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {

            color: white;

            font-size: 22px;
            font-weight: 800;

            letter-spacing: 0.3px;
        }

        .emoji {

            width: 48px;
            height: 48px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: rgba(255,255,255,0.1);

            border: 1px solid rgba(255,255,255,0.15);

            border-radius: 50%;

            font-size: 23px;

            backdrop-filter: blur(10px);
        }

        /* ORTA ALAN */

        .center {

            flex: 1;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            text-align: center;
        }

        .title {

            margin: 0 0 8px;

            color: white;

            font-size: clamp(
                32px,
                8vw,
                50px
            );

            font-weight: 900;

            letter-spacing: -1px;
        }

        .subtitle {

            margin: 0 0 35px;

            color: #aeb9d9;

            font-size: 15px;
        }

        /* SAYI */

        .number {

            width: min(68vw, 310px);
            height: min(68vw, 310px);

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #18c8c0,
                    #7467f0
                );

            border: 10px solid rgba(
                255,
                255,
                255,
                0.12
            );

            box-shadow:

                0 25px 70px
                rgba(0,0,0,0.45),

                0 0 40px
                rgba(24,200,192,0.15),

                inset 0 0 30px
                rgba(255,255,255,0.2);

            color: white;

            font-size: clamp(
                70px,
                20vw,
                115px
            );

            font-weight: 900;

            text-shadow:
                0 5px 15px rgba(0,0,0,0.2);

            transition: 0.3s;
        }

        /* SAYI ANİMASYONU */

        .number.pop {

            animation:
                pop 0.45s ease;
        }

        @keyframes pop {

            0% {

                transform:
                    scale(0.6)
                    rotate(-8deg);

                opacity: 0.4;
            }

            60% {

                transform:
                    scale(1.1)
                    rotate(3deg);

                opacity: 1;
            }

            100% {

                transform:
                    scale(1)
                    rotate(0deg);
            }
        }

        /* BUTON */

        .button-area {

            width: 100%;

            max-width: 520px;

            margin: 0 auto;
        }

        button {

            width: 100%;

            height: 65px;

            border: none;

            border-radius: 20px;

            background:
                linear-gradient(
                    135deg,
                    #18c8c0,
                    #7467f0
                );

            color: white;

            font-size: 17px;

            font-weight: 900;

            letter-spacing: 0.5px;

            cursor: pointer;

            box-shadow:
                0 12px 30px
                rgba(24,200,192,0.2);

            transition:
                transform 0.15s,
                box-shadow 0.15s;
        }

        button:hover {

            box-shadow:
                0 15px 35px
                rgba(116,103,240,0.35);

            transform:
                translateY(-2px);
        }

        button:active {

            transform:
                scale(0.96);
        }

        /* GEÇMİŞ */

        .history {

            height: 55px;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            overflow: hidden;
        }

        .history span {

            padding:
                7px 11px;

            border-radius: 10px;

            background:
                rgba(255,255,255,0.08);

            border:
                1px solid
                rgba(255,255,255,0.08);

            color: #c5cde5;

            font-size: 12px;

            backdrop-filter:
                blur(5px);
        }

        /* ARKA PLAN IŞIKLARI */

        .light {

            position: absolute;

            border-radius: 50%;

            pointer-events: none;

            filter: blur(2px);

            opacity: 0.35;

            animation:
                float 6s ease-in-out infinite;
        }

        .light.one {

            width: 90px;
            height: 90px;

            background: #18c8c0;

            top: 18%;
            left: -30px;
        }

        .light.two {

            width: 70px;
            height: 70px;

            background: #8b7cff;

            top: 40%;
            right: -25px;

            animation-delay: 2s;
        }

        .light.three {

            width: 50px;
            height: 50px;

            background: #18c8c0;

            bottom: 20%;
            left: 10%;

            animation-delay: 1s;
        }

        @keyframes float {

            0%,
            100% {

                transform:
                    translateY(0);
            }

            50% {

                transform:
                    translateY(-20px);
            }
        }

        /* KÜÇÜK TELEFONLAR */

        @media (max-height: 650px) {

            .number {

                width: 190px;
                height: 190px;

                font-size: 70px;
            }

            .subtitle {

                margin-bottom: 15px;
            }

            button {

                height: 55px;
            }

            .title {

                font-size: 30px;
            }
        }

    </style>
</head>


<body>

<div class="app">

    <!-- Arka plan ışıkları -->

    <div class="light one"></div>

    <div class="light two"></div>

    <div class="light three"></div>


    <!-- ÜST -->

    <div class="header">

        <div class="logo">
            Şanslı Sayım ✨
        </div>

        <div class="emoji">
            🎲
        </div>

    </div>


    <!-- ORTA -->

    <div class="center">

        <h1 class="title">
            Sayını seç!
        </h1>

        <p class="subtitle">
            1 ile 100 arasında şansını dene ✨
        </p>


        <div
            id="sayi"
            class="number"
        >
            ?
        </div>

    </div>


    <!-- ALT -->

    <div class="button-area">

        <button onclick="sayiSec()">
            🎯 RASTGELE SAYI SEÇ
        </button>


        <div
            id="history"
            class="history"
        ></div>

    </div>

</div>


<script>

    // Son çıkan sayılar

    let gecmis = [];


    function sayiSec() {

        // 1 - 100 arasında sayı

        const sayi =
            Math.floor(
                Math.random() * 100
            ) + 1;


        // Sayı kutusu

        const kutu =
            document.getElementById(
                "sayi"
            );


        // Animasyonu sıfırla

        kutu.classList.remove(
            "pop"
        );


        // Animasyonu yeniden başlat

        void kutu.offsetWidth;


        kutu.classList.add(
            "pop"
        );


        // Sayıyı göster

        kutu.innerText =
            sayi;


        // Geçmişe ekle

        gecmis.unshift(
            sayi
        );


        // En fazla 5 sayı

        if (gecmis.length > 5) {

            gecmis.pop();

        }


        // Geçmiş alanı

        const history =
            document.getElementById(
                "history"
            );


        history.innerHTML =
            "";


        // Sayıları oluştur

        gecmis.forEach(
            function(numara) {

                const span =
                    document.createElement(
                        "span"
                    );

                span.innerText =
                    numara;

                history.appendChild(
                    span
                );

            }
        );

    }


    // PWA Service Worker

    if (
        "serviceWorker"
        in navigator
    ) {

        navigator.serviceWorker.register(
            "sw.js"
        );

    }

</script>

</body>
</html>
